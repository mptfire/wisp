# Zapstore metadata for Fire Wisp (de.rtard.wisp)
# Run `zsp` (https://zapstore.dev) with your Nostr key & signing keystore to
# generate the C1 signing certificate proof and publish releases to Zapstore.
repository: https://github.com/mptfire/wisp
name: Fire Wisp
summary: Privacy-hardened Nostr client for Android with built-in Tor, sovereign auth, and Lightning zaps.
icon: ./app/src/main/res/drawable-nodpi/ic_wisp_logo.png
release_notes: ./dist/release-notes.md
description: |
  Fire Wisp is a community-maintained, privacy-focused fork of Wisp for Android:
  - Sovereign Nostr sign-in: Amber (NIP-55), NIP-49 encrypted keys (ncryptsec), NIP-06 12/24-word recovery phrases, and mandatory key backup on signup. Zero Google Sign-In or Google Drive SDKs.
  - Built-in fail-closed Tor (kmp-tor) with one-tap toggle on the login screen and drawer.
  - Preconfigured with Fire Wisp's anti-spam Nostr relay (wss://firewisp.relay.rtard.de) and free public Blossom media hosting (blossom.nostr.build / blossom.primal.net, configurable in Settings).
  - NIP-17 seal-authenticated encrypted DMs, gated DM media loading, undo reposts (NIP-09), image alt text (NIP-92), hashtag muting, and Lightning zaps (NWC / Spark).
tags:
  - nostr
  - social
  - privacy
  - tor
  - lightning
release_filter: '^v[0-9]+\.[0-9]+\.[0-9]+-fork\.[0-9]+$'
match: '^wisp-.*\.apk$'
metadata_sources: [github]
