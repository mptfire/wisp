# Zapstore metadata for Fire Wisp (de.rtard.wisp)
# Run `zsp` (https://zapstore.dev) with your Nostr key & signing keystore to
# generate the C1 signing certificate proof and publish releases to Zapstore.
repository: https://github.com/mptfire/wisp
name: Fire Wisp
summary: Privacy-hardened Nostr client for Android with built-in Tor, sovereign auth, and Lightning zaps.
icon: ./app/src/main/res/drawable-nodpi/ic_wisp_logo.png
release_notes: ./dist/release-notes.md
description: |
  Fire Wisp is a community-maintained, privacy-focused fork of Wisp for Android:
  - Sovereign Nostr sign-in: unified NIP-55 & NIP-46 signer picker (Amber, Primal, Cambium, Amethyst), native NIP-46 remote bunker (bunker:// & nostrconnect:// QR), NIP-49 encrypted keys (ncryptsec), NIP-06 12/24-word recovery phrases, and mandatory key backup on signup.
  - Zero Google telemetry: stripped Google Sign-In, Google Drive backup, ML Kit (replaced with open-source ZXing QR decoding), Play Services, Firebase, and Datatransport/Clearcut SDKs.
  - Built-in fail-closed Tor (kmp-tor) with one-tap toggle on the login screen and drawer, plus dedicated Local Relay support for Citrine (ws://127.0.0.1:4869) and private LAN relays.
  - Preconfigured with Fire Wisp's anti-spam Nostr relay (wss://relay.firewisp.de) and free public Blossom media hosting (blossom.nostr.build / blossom.primal.net, configurable in Settings).
  - NIP-17 seal-authenticated encrypted DMs, gated DM media loading, undo reposts (NIP-09), image alt text (NIP-92), hashtag muting, block confirmations, Android Share target, and Lightning zaps (NWC / Spark).
tags:
  - nostr
  - social
  - privacy
  - tor
  - lightning
release_filter: '^v[0-9]+\.[0-9]+\.[0-9]+-fork\.[0-9]+$'
match: '^wisp-.*\.apk$'
metadata_sources: [github]
