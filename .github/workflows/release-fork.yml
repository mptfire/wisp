name: fork-release

# Builds the signed fork APK and attaches it to a GitHub Release together
# with its SHA256SUMS. Runs only on explicit fork release tags
# (v*fork*) or manual dispatch — never on upstream PRs.
#
# Required repository secrets:
#   WISP_FORK_KEYSTORE_BASE64      — base64 of the fork release keystore (.jks)
#   WISP_FORK_KEYSTORE_PASSWORD    — keystore password
#   WISP_FORK_KEY_ALIAS            — key alias (wisp-fork)
#   WISP_FORK_KEY_PASSWORD         — key password (equals the keystore password for PKCS12)

on:
  push:
    tags:
      - 'v*fork*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Decode keystore
        run: |
          echo "$WISP_FORK_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/wisp-fork-release.jks"
          echo "WISP_FORK_KEYSTORE=$RUNNER_TEMP/wisp-fork-release.jks" >> "$GITHUB_ENV"
        env:
          WISP_FORK_KEYSTORE_BASE64: ${{ secrets.WISP_FORK_KEYSTORE_BASE64 }}

      - name: Build signed release APK
        env:
          WISP_FORK_KEYSTORE_PASSWORD: ${{ secrets.WISP_FORK_KEYSTORE_PASSWORD }}
          WISP_FORK_KEY_ALIAS: ${{ secrets.WISP_FORK_KEY_ALIAS }}
          WISP_FORK_KEY_PASSWORD: ${{ secrets.WISP_FORK_KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleRelease

      - name: Verify signature and checksum
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          test -f "$APK"
          APKSIGNER="$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort | tail -1)"
          "$APKSIGNER" verify --print-certs "$APK" | grep -q "CN=Wisp Fork Release" \
            || { echo "unexpected signer" >&2; exit 1; }
          sha256sum "$APK" > SHA256SUMS
          cat SHA256SUMS

      - name: Extract version
        id: version
        run: echo "tag=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Wisp fork ${{ steps.version.outputs.tag }}
          body_path: dist/release-notes.md
          files: |
            app/build/outputs/apk/release/app-release.apk
            SHA256SUMS
