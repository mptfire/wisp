name: fork-release

# Builds the fork APK, runs the unit-test gate, signs it, and attaches it
# to a GitHub Release with SHA256SUMS. Releases publish strictly on
# v*fork* tags; workflow_dispatch builds artifact-only unless a tag input
# is supplied.
#
# Required repository secrets:
#   WISP_FORK_KEYSTORE_BASE64    - base64 of the fork release keystore (.jks)
#   WISP_FORK_KEYSTORE_PASSWORD  - keystore password (PKCS12 key password)
#   WISP_FORK_KEY_ALIAS          - key alias (wisp-fork)
#   BREEZ_API_KEY                - Spark/Lightning API key (build fails without it)

on:
  push:
    tags:
      - 'v*fork*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to publish (e.g. v1.3.0-fork.1). Leave empty to build artifacts only.'
        required: false
        default: ''

permissions:
  contents: write

env:
  OBX_DISABLE_ANALYTICS: 'true'

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Check required secrets
        env:
          WISP_FORK_KEYSTORE_BASE64: ${{ secrets.WISP_FORK_KEYSTORE_BASE64 }}
          WISP_FORK_KEYSTORE_PASSWORD: ${{ secrets.WISP_FORK_KEYSTORE_PASSWORD }}
          WISP_FORK_KEY_ALIAS: ${{ secrets.WISP_FORK_KEY_ALIAS }}
          BREEZ_API_KEY: ${{ secrets.BREEZ_API_KEY }}
        run: |
          missing=0
          for v in WISP_FORK_KEYSTORE_BASE64 WISP_FORK_KEYSTORE_PASSWORD WISP_FORK_KEY_ALIAS BREEZ_API_KEY; do
            if [ -z "${!v}" ]; then echo "secret $v is empty" >&2; missing=1; fi
          done
          exit $missing

      - name: Decode keystore
        run: |
          echo "$WISP_FORK_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/wisp-fork-release.jks"
          echo "WISP_FORK_KEYSTORE=$RUNNER_TEMP/wisp-fork-release.jks" >> "$GITHUB_ENV"
        env:
          WISP_FORK_KEYSTORE_BASE64: ${{ secrets.WISP_FORK_KEYSTORE_BASE64 }}

      - name: Unit test gate
        env:
          BREEZ_API_KEY: ${{ secrets.BREEZ_API_KEY }}
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Build signed release APK
        env:
          WISP_FORK_KEYSTORE_PASSWORD: ${{ secrets.WISP_FORK_KEYSTORE_PASSWORD }}
          WISP_FORK_KEY_ALIAS: ${{ secrets.WISP_FORK_KEY_ALIAS }}
          BREEZ_API_KEY: ${{ secrets.BREEZ_API_KEY }}
        run: ./gradlew --no-daemon assembleRelease

      - name: Resolve release tag
        id: tag
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "name=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          elif [ -n "$INPUT_TAG" ]; then
            echo "name=$INPUT_TAG" >> "$GITHUB_OUTPUT"
          else
            echo "name=" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify signature, pin certificate, stage release files
        env:
          RELEASE_TAG: ${{ steps.tag.outputs.name }}
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          test -f "$APK"
          APKSIGNER="$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)"
          "$APKSIGNER" verify --print-certs "$APK" > certs.txt
          EXPECTED=3b99014bdceabeaa0575d8c6aac39150d6fdde78371140384789e0eb3590256a
          grep -q "certificate SHA-256 digest: $EXPECTED" certs.txt \
            || { echo "unexpected signing certificate" >&2; exit 1; }
          VERSION="$(python3 -c 'import json; print(json.load(open("app/build/outputs/apk/release/output-metadata.json"))["elements"][0]["versionName"])')"
          VERSIONCODE="$(python3 -c 'import json; print(json.load(open("app/build/outputs/apk/release/output-metadata.json"))["elements"][0]["versionCode"])')"
          RJ_VERSION="$(python3 -c 'import json; print(json.load(open("dist/release.json"))["version"])')"
          RJ_CODE="$(python3 -c 'import json; print(json.load(open("dist/release.json"))["versionCode"])')"
          [ "$VERSION" = "$RJ_VERSION" ] || { echo "versionName $VERSION != dist/release.json $RJ_VERSION" >&2; exit 1; }
          [ "$VERSIONCODE" = "$RJ_CODE" ] || { echo "versionCode $VERSIONCODE != dist/release.json $RJ_CODE" >&2; exit 1; }
          if [ -n "$RELEASE_TAG" ] && [ "$RELEASE_TAG" != "v${VERSION}" ]; then
            echo "release tag $RELEASE_TAG does not match built version v${VERSION}" >&2; exit 1
          fi
          mkdir staging
          cp "$APK" "staging/wisp-${VERSION}.apk"
          ( cd staging && sha256sum "wisp-${VERSION}.apk" > SHA256SUMS && sha256sum -c SHA256SUMS )
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
          cp certs.txt staging/certs.txt

      - name: Publish GitHub Release
        if: steps.tag.outputs.name != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          name: Fire Wisp ${{ steps.tag.outputs.name }}
          body_path: dist/release-notes.md
          files: |
            staging/wisp-${{ env.VERSION }}.apk
            staging/SHA256SUMS

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: fork-release-files
          path: |
            staging/*
